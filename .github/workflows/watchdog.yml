name: 4b-tunnel-watchdog

on:
  schedule:
    # Backstop only: scheduled runs in this private repo land every 4-5h, so the
    # resident runner below hands over to its own successor instead of relying
    # on this cron for the keepalive interval.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if tunnel is healthy"
        default: "false"

concurrency:
  group: 4b-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install colab cli
        run: pip install google-colab-cli==0.6.0 requests "jupyter_kernel_client==1.0.2"
      - name: Debug jupyter_kernel_client
        run: |
          python -c "import importlib.metadata as md; print('dist ver:', md.version('jupyter-kernel-client'))"
          python -c "import jupyter_kernel_client as m; print('file:', m.__file__); print('names:', [n for n in dir(m) if not n.startswith('_')])"
      - name: Fetch ngrok binary
        run: |
          curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o /tmp/ngrok.tgz
          tar xzf /tmp/ngrok.tgz -C "$GITHUB_WORKSPACE"
          chmod +x "$GITHUB_WORKSPACE/ngrok"
          "$GITHUB_WORKSPACE/ngrok" --version
      - name: Run watchdog
        env:
          COLAB_TOKEN_4B_B64: ${{ secrets.COLAB_TOKEN_4B_B64 }}
          COLAB_SESSIONS_4B_B64: ${{ secrets.COLAB_SESSIONS_4B_B64 }}
          PREDICTION_ENV_4B_B64: ${{ secrets.PREDICTION_ENV_4B_B64 }}
          NGROK_TOKEN_4B: ${{ secrets.NGROK_TOKEN_4B }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: python watchdog.py
